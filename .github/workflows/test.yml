name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep
      - run: bash -n openclaw-sync.sh quick-start.sh init-github-repo.sh tests/test_sync.sh
      - run: shellcheck -x openclaw-sync.sh quick-start.sh init-github-repo.sh tests/test_sync.sh
      - run: bash tests/test_sync.sh
